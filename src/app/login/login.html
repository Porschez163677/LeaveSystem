<h2>เข้าสู่ระบบ</h2>

<form (ngSubmit)="onSubmit()">
  <div>
    <label for="employeeid">รหัสบุคลากร</label>
    <input id="employeeid" name="employeeid" type="text" [(ngModel)]="employeeid" required />
  </div>
  <div>
    <label for="password">รหัสผ่าน</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required />
  </div>

  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }

  <button type="submit">เข้าสู่ระบบ</button>
</form>
